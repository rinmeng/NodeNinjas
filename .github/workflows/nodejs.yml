name: Run Tests
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "ctms/server/package-lock.json" # Updated to use server package-lock

      - name: Debug - List directory structure
        run: |
          ls -la
          ls -la ctms/server

      - name: Install server dependencies
        run: |
          cd ctms/server
          npm install

      - name: Setup PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@v4
        with:
          username: postgres
          password: postgres
          database: ctms_test # Assuming this is your test database name
          port: 5432

      - name: Run tests
        run: |
          cd ctms/server
          CI=true npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ctms_test
