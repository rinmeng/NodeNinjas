name: Run Tests
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Install dependencies
        working-directory: ./ctms/client
        run: npm install
          
      - name: Run tests
        working-directory: ./ctms/client
        run: npm test